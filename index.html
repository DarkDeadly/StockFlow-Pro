<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow Pro</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="stylesheet" href="./assets/css/form.css">
</head>

<body>
    <!-- 1. APP WRAPPER (The Layout Root) -->
    <div class="app-layout">

        <!-- 2. SIDEBAR COMPONENT -->
        <aside class="sidebar">
            <div class="sidebar__brand">
                <h2 class="sidebar__title">StockFlow Pro</h2>
            </div>

            <nav class="sidebar__nav">
                <ul class="sidebar__menu">
                    <li class="sidebar__item">
                        <a href="index.html" class="sidebar__link sidebar__link--active">
                            <span class="sidebar__icon">🏠</span> Home
                        </a>
                    </li>
                    <li class="sidebar__item">
                        <a href="form.html" class="sidebar__link">
                            <span class="sidebar__icon">📦</span> Create
                        </a>
                    </li>
                  
                    <li class="sidebar__item">
                        <a href="dashboard.html" class="sidebar__link">
                            <span class="sidebar__icon">📊</span> Dashboard
                        </a>
                    </li>
                    <li class="sidebar__item">
                        <a href="#" class="sidebar__link">
                            <span class="sidebar__icon">📈</span> Reports
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- 3. MAIN WORKSPACE VIEW -->
        <div class="main-viewport">

            <!-- 4. TOP UTILITY HEADER -->
            <header class="top-bar">
                <div class="top-bar__search-box">
                    <!-- Added an explicit label for accessibility (hidden visually but readable by screen readers) -->
                    <label Improvement for="searchBar" class="sr-only">Search products</label>
                    <input type="search" id="searchBar" class="top-bar__search-input" placeholder="Search products...">
                </div>

                <div class="top-bar__actions">
                    <button id="darkModeToggle" class="top-bar__btn-toggle" aria-label="Toggle dark mode">🌙</button>

                    <div class="user-badge">
                        <span class="user-badge__greeting">Welcome back,</span>
                        <strong class="user-badge__name">Admin</strong>
                    </div>
                </div>
            </header>

            <!-- 5. DYNAMIC CONTENT CONTAINER -->
            <main id="content-area" class="content-view">
                <!-- Single wrapper inside main makes managing grid/flex spacing for dashboard cards incredibly easy -->
                <div class="content-view__container">
                    <h1 class="content-view__title">Welcome to StockFlow Pro</h1>
                    <!-- Dynamic views will mount here -->
                </div>
            </main>


        </div>
    </div>

    <!-- Dialog moved outside app-layout for proper stacking context -->
    <dialog id="product-modal" class="product-modal">
        <div class="product-modal__content">
            <header class="product-modal__header">
                <h2 id="modal-title">Product Details</h2>
                <button id="modal-close-btn" class="btn-close" aria-label="Close dialog">&times;</button>
            </header>
            <div id="modal-body" class="product-modal__body">
                <!-- Content injected here -->
            </div>
        </div>
    </dialog>
    <dialog id="sell-form-modal" class="product-modal">
        <div class="product-modal__content">
            <header class="product-modal__header">
                <h2 id="sell-modal-title">Sell Product</h2>
                <button id="sell-modal-close-btn" class="btn-close" aria-label="Close dialog">&times;</button>
            </header>
            <div id="sell-modal-body" class="product-modal__body">
                <div class="product-details">

                </div>
                <div class="user-feedback">

                </div>
                <form id="sellProductForm" class="sell-form">
                    <div class="form-group">
                        <label for="productQuantity" class="form-label">Product Quantity</label>
                        <input type="number" id="productQuantity" name="productQuantity" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="productReceiver" class="form-label">Receiver</label>
                        <input type="text" id="productReceiver" name="productReceiver" class="form-input" required>
                    </div>
                    <button type="submit" class="form-btn">sell Product</button>
                </form>
            </div>
        </div>
    </dialog>
    <dialog id="restock__dialog" class="product-modal">
        <div class="product-modal__content">
            <header class="product-modal__header">
                <h2 id="restock-modal-title">Sell Product</h2>
                <button id="restock-modal-close-btn" class="btn-close" aria-label="Close dialog">&times;</button>
            </header>
            <div id="restock-modal-body" class="product-modal__body">
                <div class="modal-detail-grid">
                    <div class="productDetail">

                    </div>
                    <div class="user-feedback">

                    </div>
                    <form id="refillStock" class="refill-form">
                        <div class="form-group">
                            <label for="productQuantity" class="form-label">Product Quantity</label>
                            <input type="number" id="quantityAdd" name="productQuantity" class="form-input">
                        </div>
                        <button type="submit" class="form-btn">refill Product</button>
                    </form>

                </div>
            </div>
        </div>
    </dialog>
    <script type="module" src="./js/data.js"></script>
    <script type="module" src="./js/ui.js"></script>
</body>

</html>
