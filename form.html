<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow Pro</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <link rel="stylesheet" href="./assets/css/form.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar__brand">
                <h2 class="sidebar__title">StockFlow Pro</h2>
            </div>

            <nav class="sidebar__nav">
                <ul class="sidebar__menu">
                    <li class="sidebar__item">
                        <a href="index.html" class="sidebar__link sidebar__link--active">
                            <span class="sidebar__icon">🏠</span> Home
                        </a>
                    </li>
                    <li class="sidebar__item">
                        <a href="form.html" class="sidebar__link">
                            <span class="sidebar__icon">📦</span> Create
                        </a>
                    </li>
                    <li class="sidebar__item">
                        <a href="dashboard.html" class="sidebar__link">
                            <span class="sidebar__icon">📊</span> Dashboard
                        </a>
                    </li>
                    <li class="sidebar__item">
                        <a href="#" class="sidebar__link">
                            <span class="sidebar__icon">📈</span> Reports
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>
           <div class="main-viewport">

            <!-- 4. TOP UTILITY HEADER -->
            <header class="top-bar">
               

                <div class="top-bar__actions">
                    

                    <div class="user-badge">
                        <span class="user-badge__greeting">Welcome back,</span>
                        <strong class="user-badge__name">Admin</strong>
                    </div>
                </div>
                <button id="darkModeToggle" class="top-bar__btn-toggle" aria-label="Toggle dark mode">🌙</button>
            </header>

            <!-- 5. DYNAMIC CONTENT CONTAINER -->
            <main id="form-content" class="form-content">
                <!-- Single wrapper inside main makes managing grid/flex spacing for dashboard cards incredibly easy -->
                <div class="form-container">
                    <h1 class="form-container__title">Welcome to StockFlow Pro</h1>
                    <p class="form-container__description">Use the form below to add new products to your inventory. Fill in all the required fields and click "Add Product" to save it to your stock list.</p>
                    <div class="user-feedback">
                        
                    </div>
                    <form id="productForm" class="product-form" >
                        <div class="form-group">
                            <label for="productName" class="form-label">Product Name</label>
                            <input type="text" id="productName" name="productName" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="productCategory" class="form-label">Product Category</label>
                            <select id = "productCategory" name="productCategory" class="form-input" required>
                                <option value="">Select a category</option>
                                <option value="electronics">Electronics</option>
                                <option value="sports">Sports</option>
                                <option value="furniture">Furniture</option>
                                <option value="books">Books</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="productQuantity" class="form-label">Quantity</label>
                            <input type="number" id="productQuantity" name="productQuantity" class="form-input" required min="0">       
                        </div>
                        <div class="form-group">
                            <label for = "productPrice" class="form-label" >Price</label>
                            <input type="number" id="productPrice" name="productPrice" class="form-input" required min="0" step="0.01">
                        </div>
                        <div class="form-group">
                            <label for="productSupplier" class="form-label">Supplier</label>
                            <input type="text" id="productSupplier" name="productSupplier" class="form-input" required>
                        </div>
                        <button type="submit" class="form-btn">Add Product</button>
                    </form>
                </div>
            </main>
            

        </div>
    </div>
    <script type="module" src="./js/data.js"></script>
    <script type="module" src="./js/form.js"></script>
</body>
</html>
